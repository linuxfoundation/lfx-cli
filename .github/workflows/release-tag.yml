---
name: Publish Tagged Release

"on":
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          # Disable caching: this workflow publishes runtime artifacts on
          # tag push, so a poisoned cache from an earlier run could leak
          # into a release build (zizmor cache-poisoning audit).
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6.4.0
        with:
          # Constrained to v2 (the action's documented default) so a
          # future GoReleaser v3 release doesn't silently break old tags.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  darwin:
    name: Darwin (native, cgo-enabled)
    # Built natively on macos-latest so KeychainBackend (requires
    # "darwin && cgo") is actually compiled in.
    needs: goreleaser
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          # Disable caching: publishes runtime artifacts on tag push.
          cache: false

      - name: Build and archive darwin binaries
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          name="lfx-cli"
          workdir="$(mktemp -d)"

          for arch in amd64 arm64; do
            binpath="${workdir}/lfx"
            GOOS=darwin GOARCH="${arch}" go build \
              -ldflags="-s -w -X main.version=${version}" \
              -o "${binpath}" ./cmd/lfx

            archive="${name}_darwin_${arch}.tar.gz"
            tar -czf "${archive}" -C "${workdir}" lfx -C "${GITHUB_WORKSPACE}" LICENSE LICENSE-docs README.md
            rm -f "${binpath}"

            shasum -a 256 "${archive}" >> checksums-darwin.txt
          done

      - name: Upload darwin archives and merge checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          gh release upload "${tag}" lfx-cli_darwin_amd64.tar.gz lfx-cli_darwin_arm64.tar.gz \
            --repo "${GITHUB_REPOSITORY}" --clobber

          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern checksums.txt --output checksums.txt
          # Remove any existing entries for the darwin archives by filename
          # (not full-line match, rebuilt archives have new hashes each run
          # from embedded timestamps) before appending, so reruns don't
          # leave stale or duplicate checksums.txt entries.
          awk '{print $2}' checksums-darwin.txt > darwin-filenames.txt
          grep -v -F -f darwin-filenames.txt checksums.txt > checksums-filtered.txt || true
          mv checksums-filtered.txt checksums.txt
          cat checksums-darwin.txt >> checksums.txt
          gh release upload "${tag}" checksums.txt --repo "${GITHUB_REPOSITORY}" --clobber
